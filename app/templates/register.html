<html>
    <head>
        <title>Heirloom</title>
        <link rel="stylesheet" href="/static/style.css">
    </head>
    <body class="center-screen">
        <div class="setup-box">
            <h1>Join Heirloom</h1>
            <p class="mb-30" style="color: #bbb;">Create your account using your invite code.</p>
            
            <form action="/register" method="post" class="text-left">
                <label for="invite_code">Invite Code</label>
                <input type="text" name="invite_code" id="invite_code" value="{{ invite_code }}" required readonly class="text-green code-text">
                
                <label for="username">Choose a Username</label>
                <input type="text" name="username" id="username" required autocomplete="off">
                
                <label for="password">Choose a Password</label>
                <input type="password" name="password" id="password" required>
                
                <button type="submit" class="btn w-full">Create Account</button>
            </form>
        </div>
    </body>
</html>
