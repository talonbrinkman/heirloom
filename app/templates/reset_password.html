<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Reset Password - Heirloom</title>
        <link rel="stylesheet" href="/static/style.css">
        <script src="/static/password-strength.js"></script>
    </head>
    <body class="center-screen">
        <div class="setup-box">
            <h1 style="background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Reset Password</h1>
            <p style="margin-bottom: 20px; color: var(--text-secondary);">Choose a new password for <strong style="color: var(--text-primary);">{{ username }}</strong></p>
            <div id="errorNotice" style="display: none; text-align: center; margin-bottom: 20px; padding: 10px 15px; border-radius: 8px; background: rgba(229, 9, 20, 0.15); border: 1px solid rgba(229, 9, 20, 0.4); color: var(--accent-primary); font-size: 0.9em;"></div>
            <form action="/reset_password/{{ token }}" method="post" style="text-align: left;">
                <label for="password">New Password</label>
                <input type="password" name="password" id="password" required>
                <div class="password-strength-container" data-for="password">
                    <div class="password-strength-bar">
                        <div class="password-strength-fill"></div>
                    </div>
                    <div class="password-strength-text"></div>
                </div>
                <label for="confirm_password">Confirm Password</label>
                <input type="password" name="confirm_password" id="confirm_password" required>
                <button type="submit" class="btn w-full" style="margin-top: 10px;">Set New Password</button>
            </form>
        </div>
        <script>
            const params = new URLSearchParams(window.location.search);
            const notice = document.getElementById('errorNotice');
            let noticeTimeout = null;

            function showNotice(msg) {
                if (!notice) return;
                notice.textContent = msg;
                notice.style.display = 'block';
                if (noticeTimeout) clearTimeout(noticeTimeout);
                noticeTimeout = setTimeout(() => {
                    notice.style.display = 'none';
                    notice.textContent = '';
                }, 3000);
            }

            if (params.get('error') === 'passwords_mismatch') {
                showNotice('Passwords do not match. Please try again.');
            }

            document.querySelector('form').addEventListener('submit', function(e) {
                const p1 = document.getElementById('password').value;
                const p2 = document.getElementById('confirm_password').value;
                if (p1 !== p2) {
                    e.preventDefault();
                    showNotice('Passwords do not match. Please try again.');
                    document.getElementById('confirm_password').focus();
                }
            });
        </script>
    </body>
</html>
