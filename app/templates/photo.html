<!DOCTYPE html>
<html>
<head>
    <title>Photo Viewer - {{ photo.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .photo-body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .photo-content {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
        }
        .photo-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            z-index: 10;
            pointer-events: none;
        }
        .photo-header > * {
            pointer-events: auto;
        }
        .photo-title {
            color: #fff;
            margin: 0;
            font-size: 1.5em;
        }
        .close-btn {
            color: #fff;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: background 0.2s;
        }
        .close-btn:hover {
            background: rgba(255,255,255,0.4);
        }
        .photo-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #fff;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: background 0.2s, transform 0.15s ease-out;
            z-index: 10;
            border: none;
            cursor: pointer;
            outline: none;
        }
        .photo-arrow:hover { 
            background: rgba(255,255,255,0.4); 
            transform: translateY(-50%) scale(1.08);
        }
        .left-arrow { left: 20px; }
        .right-arrow { right: 20px; }
    </style>
</head>
<body class="photo-body">
    <div class="photo-header">
        <div>
            <h1 class="photo-title" id="photoTitle">{{ photo.title }}</h1>
            {% set display_date = photo.date_taken or photo.date_added %}
            <div id="photoDateContainer" style="color: rgba(255, 255, 255, 0.7); font-size: 0.9em; margin-top: 4px; display: {% if display_date %}flex{% else %}none{% endif %}; align-items: center; gap: 5px;">
                <i data-lucide="calendar" style="width: 14px; height: 14px;"></i>
                <span id="photoDate">{{ display_date.strftime('%B %d, %Y') if display_date else '' }}</span>
            </div>
        </div>
        <div class="flex gap-15">
            {% if user.downloads_access %}
            <a href="/photo_file/{{ photo.id }}" download class="close-btn" id="photoDownloadBtn" title="Download"><i data-lucide="download"></i></a>
            {% endif %}
            <a href="{{ close_url }}" class="close-btn" title="Close" id="photoCloseBtn"><i data-lucide="x"></i></a>
        </div>
    </div>
    
    <button type="button" class="photo-arrow left-arrow" id="prevPhotoBtn" onclick="navPhoto(-1)" title="Previous" style="display: {% if prev_photo_id %}flex{% else %}none{% endif %};">
        <i data-lucide="chevron-left"></i>
    </button>
    <button type="button" class="photo-arrow right-arrow" id="nextPhotoBtn" onclick="navPhoto(1)" title="Next" style="display: {% if next_photo_id %}flex{% else %}none{% endif %};">
        <i data-lucide="chevron-right"></i>
    </button>

    <div id="photoMediaContainer" style="display: contents;">
        {% if is_video %}
        <video class="photo-content" controls autoplay>
            <source src="/photo_file/{{ photo.id }}">
            Your browser does not support the video tag.
        </video>
        {% else %}
        <img src="/photo_file/{{ photo.id }}" class="photo-content" alt="{{ photo.title }}">
        {% endif %}
    </div>

    <script src="/static/lucide.min.js"></script>
    <script>lucide.createIcons();</script>

<script>
    const photos = {{ photos_json | safe }};
    let currentIndex = photos.findIndex(p => p.id === {{ photo.id }});
    if (currentIndex === -1 && photos.length > 0) currentIndex = 0;

    function navPhoto(delta) {
        if (!photos || photos.length === 0) return;
        const newIndex = currentIndex + delta;
        if (newIndex >= 0 && newIndex < photos.length) {
            updatePhotoUI(newIndex);
        }
    }

    function updatePhotoUI(index) {
        if (index < 0 || index >= photos.length) return;
        currentIndex = index;
        const p = photos[currentIndex];

        // Update document title
        document.title = "Photo Viewer - " + p.title;

        // Update header info
        const titleEl = document.getElementById('photoTitle');
        if (titleEl) titleEl.textContent = p.title;

        const dateContainer = document.getElementById('photoDateContainer');
        const dateEl = document.getElementById('photoDate');
        if (p.date_str) {
            if (dateEl) dateEl.textContent = p.date_str;
            if (dateContainer) dateContainer.style.display = 'flex';
        } else {
            if (dateContainer) dateContainer.style.display = 'none';
        }

        const downloadBtn = document.getElementById('photoDownloadBtn');
        if (downloadBtn) downloadBtn.href = '/photo_file/' + p.id;

        // In-place swap media element
        const container = document.getElementById('photoMediaContainer');
        if (container) {
            if (p.is_video) {
                container.innerHTML = `
                    <video class="photo-content" controls autoplay>
                        <source src="/photo_file/${p.id}">
                        Your browser does not support the video tag.
                    </video>
                `;
            } else {
                container.innerHTML = `
                    <img src="/photo_file/${p.id}" class="photo-content" alt="${p.title}">
                `;
            }
        }

        // Update arrow button visibility
        const prevBtn = document.getElementById('prevPhotoBtn');
        const nextBtn = document.getElementById('nextPhotoBtn');
        if (prevBtn) prevBtn.style.display = (currentIndex > 0) ? 'flex' : 'none';
        if (nextBtn) nextBtn.style.display = (currentIndex < photos.length - 1) ? 'flex' : 'none';

        // Update browser URL in-place without page reload
        try {
            const url = new URL(window.location.href);
            url.pathname = '/photo/' + p.id;
            history.replaceState(null, '', url.toString());
        } catch (e) {}

        preloadAdjacent(currentIndex);
        if (window.lucide) lucide.createIcons();
    }

    function preloadAdjacent(idx) {
        [-1, 1].forEach(offset => {
            const target = photos[idx + offset];
            if (target && !target.is_video) {
                const img = new Image();
                img.src = '/photo_file/' + target.id;
            }
        });
    }

    // Preload next/prev on initial load
    preloadAdjacent(currentIndex);

    async function loadInbox() {
        try {
            const res = await fetch('/api/inbox');
            const data = await res.json();
            const items = data.invites;
            const resets = data.reset_requests || [];
            const badge = document.getElementById('inboxBadge');
            const container = document.getElementById('inboxItems');
            if(!badge || !container) return;
            
            const totalCount = items.length + resets.length;
            if (totalCount > 0) {
                badge.style.display = 'block';
                let html = '';
                html += items.map(inv => `
                    <div class="inbox-item">
                        <div><strong>${inv.sender}</strong> invited you to watch <em>${inv.title}</em></div>
                        <div class="inbox-actions">
                            <button class="btn btn-sm" onclick="respondInvite(${inv.id}, 'accept')">Accept</button>
                            <button class="btn btn-sm btn-secondary" onclick="respondInvite(${inv.id}, 'decline')">Decline</button>
                        </div>
                    </div>
                `).join('');
                html += resets.map(pr => `
                    <div class="inbox-item">
                        <div><strong>${pr.username}</strong> is requesting a password reset</div>
                        <small>Requested ${pr.created_at}</small>
                        <div class="inbox-actions">
                            <button class="btn btn-sm" onclick="respondReset(${pr.id}, 'approve')">Approve</button>
                            <button class="btn btn-sm btn-secondary" onclick="respondReset(${pr.id}, 'deny')">Deny</button>
                        </div>
                    </div>
                `).join('');
                container.innerHTML = html;
            } else {
                badge.style.display = 'none';
                container.innerHTML = '<div class="empty-state">No new notifications</div>';
            }
        } catch (err) {
            console.error("Error loading inbox:", err);
        }
    }
    
    async function respondInvite(id, action) {
        try {
            const res = await fetch(`/watch_together/${action}/${id}`, { method: 'POST' });
            const data = await res.json();
            if (data.success && action === 'accept') {
                window.location.href = `/play_sync/${data.session_id}`;
            } else {
                loadInbox();
            }
        } catch (err) {
            console.error(err);
        }
    }

    async function respondReset(id, action) {
        try {
            await fetch(`/password_reset/${action}/${id}`, { method: 'POST' });
            loadInbox();
        } catch (err) {
            console.error(err);
        }
    }
    
    function toggleInbox(e) {
        e.preventDefault();
        const menu = document.getElementById('inboxMenu');
        if (menu.style.display === 'none') {
            menu.style.display = 'block';
            loadInbox();
        } else {
            menu.style.display = 'none';
        }
    }
    
    document.addEventListener('click', function(event) {
        const menu = document.getElementById('inboxMenu');
        const btn = document.getElementById('inboxBtn');
        if (menu && btn && event.target !== btn && !btn.contains(event.target) && !menu.contains(event.target)) {
            menu.style.display = 'none';
        }
    });
    
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            const closeBtn = document.getElementById('photoCloseBtn');
            if (closeBtn && closeBtn.href) {
                window.location.href = closeBtn.href;
            }
        } else if (e.key === 'ArrowLeft') {
            navPhoto(-1);
        } else if (e.key === 'ArrowRight') {
            navPhoto(1);
        }
    });

    setInterval(loadInbox, 10000);
    document.addEventListener('DOMContentLoaded', loadInbox);
</script>

</body>
</html>
