<!DOCTYPE html>
<html>
<head>
    <title>Photo Viewer - {{ photo.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .photo-body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .photo-content {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .photo-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            z-index: 10;
        }
        .photo-title {
            color: #fff;
            margin: 0;
            font-size: 1.5em;
        }
        .close-btn {
            color: #fff;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: background 0.2s;
        }
        .close-btn:hover {
            background: rgba(255,255,255,0.4);
        }
        .photo-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #fff;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: background 0.2s;
            z-index: 10;
        }
        .photo-arrow:hover { background: rgba(255,255,255,0.4); }
        .left-arrow { left: 20px; }
        .right-arrow { right: 20px; }
    </style>
</head>
<body class="photo-body">
    <div class="photo-header">
        <h1 class="photo-title">{{ photo.title }}</h1>
        <div class="flex gap-15">
            {% if user.downloads_access %}
            <a href="/photo_file/{{ photo.id }}" download class="close-btn"><i data-lucide="download"></i></a>
            {% endif %}
            <a href="/" class="close-btn"><i data-lucide="x"></i></a>
        </div>
    </div>
    
    {% if next_photo_id %}
    <a href="/photo/{{ next_photo_id }}" class="photo-arrow left-arrow"><i data-lucide="chevron-left"></i></a>
    {% endif %}
    {% if prev_photo_id %}
    <a href="/photo/{{ prev_photo_id }}" class="photo-arrow right-arrow"><i data-lucide="chevron-right"></i></a>
    {% endif %}

    {% if is_video %}
    <video class="photo-content" controls autoplay>
        <source src="/photo_file/{{ photo.id }}">
        Your browser does not support the video tag.
    </video>
    {% else %}
    <img src="/photo_file/{{ photo.id }}" class="photo-content" alt="{{ photo.title }}">
    {% endif %}

    <script src="/static/lucide.min.js"></script>
    <script>lucide.createIcons();</script>

<script>
    async function loadInbox() {
        try {
            const res = await fetch('/api/inbox');
            const data = await res.json();
            const items = data.invites;
            const badge = document.getElementById('inboxBadge');
            const container = document.getElementById('inboxItems');
            if(!badge || !container) return;
            
            if (items.length > 0) {
                badge.style.display = 'block';
                container.innerHTML = items.map(inv => `
                    <div style="padding: 10px; border-bottom: 1px solid var(--bg-tertiary);">
                        <div><strong>${inv.sender}</strong> invited you to watch <em>${inv.title}</em></div>
                        <div style="display: flex; gap: 10px; margin-top: 10px;">
                            <button class="btn-small" onclick="respondInvite(${inv.id}, 'accept')">Accept</button>
                            <button class="btn-small bg-gray" onclick="respondInvite(${inv.id}, 'decline')">Decline</button>
                        </div>
                    </div>
                `).join('');
            } else {
                badge.style.display = 'none';
                container.innerHTML = '<div style="color: var(--text-secondary); text-align: center;">No new invitations</div>';
            }
        } catch (err) {
            console.error("Error loading inbox:", err);
        }
    }
    
    async function respondInvite(id, action) {
        try {
            const res = await fetch(`/watch_together/${action}/${id}`, { method: 'POST' });
            const data = await res.json();
            if (data.success && action === 'accept') {
                window.location.href = `/play_sync/${data.session_id}`;
            } else {
                loadInbox();
            }
        } catch (err) {
            console.error(err);
        }
    }
    
    function toggleInbox(e) {
        e.preventDefault();
        const menu = document.getElementById('inboxMenu');
        if (menu.style.display === 'none') {
            menu.style.display = 'block';
            loadInbox();
        } else {
            menu.style.display = 'none';
        }
    }
    
    document.addEventListener('click', function(event) {
        const menu = document.getElementById('inboxMenu');
        const btn = document.getElementById('inboxBtn');
        if (menu && btn && event.target !== btn && !btn.contains(event.target) && !menu.contains(event.target)) {
            menu.style.display = 'none';
        }
    });
    
    setInterval(loadInbox, 10000);
    document.addEventListener('DOMContentLoaded', loadInbox);
</script>

</body>
</html>
