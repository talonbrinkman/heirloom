services:
  heirloom:
    # We use build: . instead of image: while you are actively developing
    build: .
    container_name: heirloom
    environment:
      # These tell the container who to pretend to be (Defaults if not specified in .env)
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Chicago}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
    ports:
      # Host : Container
      - "42069:42069"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "42069", "--reload"]
    volumes:
      # Host Path : Container Path
      - ./config:/config
      - ./app:/app/app
      # Media Library Mount Examples (Can manually add volumes later)
      - ./media/tv:/media/tv:ro
      - ./media/movies:/media/movies:ro
      - ./media/photos:/media/photos:ro
      - ./media/music:/media/music:ro
    # --- Hardware Acceleration (Optional) ---
    # For Synology NAS, Unraid, or Linux hosts with Intel QuickSync / AMD GPU (VA-API), uncomment:
    # devices:
    #   - /dev/dri:/dev/dri
    #
    # For Linux hosts with NVIDIA GPU (requires NVIDIA Container Toolkit on host), uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped